apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: production
  labels:
    app: payment-service
    version: v40
spec:
  replicas: 4
  template:
    spec:
      containers:
      - name: payment-service
        image: acme/payment-service:v1.8.0
        env:
        - name: REDIS_MAX_POOL_SIZE
          value: "200"
